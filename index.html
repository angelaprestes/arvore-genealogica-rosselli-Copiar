<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Árvore genealógica — Família Rosselli</title><style>
:root{--accent:#ae5626;--ink:#302b28;--line:#a99b91;--bg:#fffdfb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Georgia,'Times New Roman',serif;color:var(--ink)}.frame{position:relative;height:100vh;min-height:350px;overflow:hidden;touch-action:none;cursor:grab}.frame.dragging{cursor:grabbing}svg{display:block;width:100%;height:100%}.line{stroke:var(--line);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.marriage{stroke:var(--accent);stroke-width:2.2}.node rect{fill:#fff;stroke:#dfd4cb;stroke-width:1.5;rx:9}.node text{font-size:17px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}.node.main rect{fill:#fff8f3;stroke:#d6a88f}.node.main text{fill:var(--ink)}.node.protagonist rect{fill:var(--accent);stroke:var(--accent);stroke-width:2}.node.protagonist text{fill:#fff;font-weight:bold;font-size:19px}.node.poet rect{fill:#fff;stroke:var(--accent);stroke-width:3;rx:9}.node.poet text{fill:var(--accent);font-weight:bold;font-size:19px}.node.spouse rect{fill:#fff8f3;stroke:#d6a88f}.node.small text{font-size:15px}.toolbar{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;z-index:2}.toolbar button{width:39px;height:39px;border:1px solid #d9c9bc;border-radius:7px;background:#fff;color:var(--ink);font:20px Arial;cursor:pointer}.toolbar button:last-child{width:auto;padding:0 12px;font-size:13px}.hint{position:absolute;left:14px;bottom:19px;font:12px Arial,sans-serif;color:#796e67;pointer-events:none}@media(max-width:600px){.hint{max-width:150px;line-height:1.3}.toolbar{right:8px;bottom:8px}}
</style></head><body><main class="frame" id="frame" aria-label="Árvore genealógica da família Rosselli; use os botões para ampliar ou reduzir e arraste para explorar"><svg id="svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc"><title id="title">Árvore genealógica da família Rosselli</title><desc id="desc">Amelia Pincherle Moravia Rosselli; seus filhos Carlo e Nello, seus cônjuges e sete netos.</desc><g id="scene">

</g></svg><div class="hint">Arraste para mover · Role para ampliar</div><div class="toolbar"><button id="plus" aria-label="Ampliar">+</button><button id="minus" aria-label="Reduzir">−</button><button id="reset" aria-label="Restaurar">Restaurar</button></div></main><script>
const svg=document.getElementById('svg'),frame=document.getElementById('frame');let view={x:0,y:0,w:1500,h:500};const initial={...view};function render(){svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}function zoom(factor,cx=.5,cy=.5){let nw=Math.max(300,Math.min(3000,view.w*factor)),nh=nw*500/1500;view.x+=(view.w-nw)*cx;view.y+=(view.h-nh)*cy;view.w=nw;view.h=nh;render()}document.getElementById('plus').onclick=()=>zoom(.8);document.getElementById('minus').onclick=()=>zoom(1.25);document.getElementById('reset').onclick=()=>{view={...initial};render()};let pointer=null;frame.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY};frame.setPointerCapture(e.pointerId);frame.classList.add('dragging')});frame.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;let rect=svg.getBoundingClientRect();view.x-=(e.clientX-pointer.x)*view.w/rect.width;view.y-=(e.clientY-pointer.y)*view.h/rect.height;pointer.x=e.clientX;pointer.y=e.clientY;render()});function stop(){pointer=null;frame.classList.remove('dragging')}frame.addEventListener('pointerup',stop);frame.addEventListener('pointercancel',stop);frame.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY>0?1.12:.89,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
</script></body></html>
